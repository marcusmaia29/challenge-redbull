<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Challenge Red Bull</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1a1a1a;
        overflow: hidden;
        /* Evita zoom por duplo toque e selecao de texto no iPad */

        user-select: none;

      #game {
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }
    </style>
  </head>

    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
